name: Desktop packages
concurrency:
  group: luqgameengine-desktop-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop-release.yml'
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: luqgameengine-windows
          - os: macos-latest
            bundle: dmg
            artifact: luqgameengine-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript dependencies
        run: npm install
      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.svg --output src-tauri/icons
      - name: Build desktop package
        run: npm run tauri:build -- --bundles ${{ matrix.bundle }}
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
